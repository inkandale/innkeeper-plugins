name = "chub-archive"
title = "Chub archive"
version = "0.3.4"
protocol = 1
command = ["./chub-archive"]
capabilities = ["import"]
bulk = true
description = "For the full chub.ai archive download: loads every card in it, with each version, into a library. Needs the archive extracted and mounted on the server."
category = "Advanced"
database = true

[config]
type = "object"

[config.properties.images]
type = "array"
title = "Image folders"
description = "The archive's hashed-data folders, such as /archive/sql/hashed-data_part1/hashed-data. Without them, cards have no image."
items = { type = "string" }

[enrichments]
rating = { type = "score", range = [0, 5], label = "Chub rating", grid = true }
topics = { type = "list", label = "Chub topics" }
site = { type = "text", label = "Archive site" }
hidden = { type = "text", label = "Hidden on its site" }
