name: publish

# Releases each plugin version in index.toml that has no release yet, then
# rebuilds the index Innkeeper installs from: the index.toml asset on the
# "index" release, concatenated from the entry.toml of each release of a
# plugin still in index.toml.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A plugin that fails the contract kit is never published.
      - run: make check
      - name: Release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          for p in $(sed -n 's/^path = "\(.*\)"/\1/p' index.toml); do
            name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$p/plugin.toml")
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$p/plugin.toml")
            tag="$name-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            go run ./internal/publish -out dist -url "$base" "$p"
            gh release create "$tag" dist/"$tag"/* --target "$GITHUB_SHA" --latest=false \
              --title "$name $version" --notes "$name $version for Innkeeper."
          done
      - name: Rebuild the published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > index-published.toml
          names=$(sed -n 's/^name = "\(.*\)"/\1/p' index.toml)
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName | select(test("-v[0-9]"))'); do
            echo "$names" | grep -qx "${tag%-v*}" || continue
            gh release download "$tag" --pattern entry.toml --output - >> index-published.toml
            echo >> index-published.toml
          done
          go run ./internal/publish -categorize index-published.toml
          if ! gh release view index >/dev/null 2>&1; then
            gh release create index --target "$GITHUB_SHA" --latest=false --title "Plugin index" \
              --notes "index.toml for Innkeeper's official plugin source. Rebuilt on every push to main."
          fi
          cp index-published.toml index.toml
          gh release upload index index.toml --clobber
