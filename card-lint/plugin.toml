name = "card-lint"
title = "Card lint"
version = "0.5.0"
protocol = 1
protocol_version = "1.3"
command = ["./card-lint"]
capabilities = ["enrich"]
# Lint makes no model calls, so one run can cover a whole archive.
enrich_max_cards = 1000000
# Free and instant, so new cards get scored as they arrive.
enrich_on_change = true
# Free and instant: runs before the plugins that call a model.
enrich_cost = 100
description = "Free, instant checks on every card, no AI needed: missing fields, too short or too long, repeated text, leftover placeholders, garbled text, and language. Scores new cards as they're imported; run it from the selection bar for cards already in the library."
category = "Quality"

[config]
type = "object"

[config.properties]
min_tokens = { type = "integer", title = "Too short under", minimum = 0, default = 50, description = "Estimated tokens across description, personality, and scenario." }
max_tokens = { type = "integer", title = "Oversized over", minimum = 1, default = 4000, description = "Estimated tokens across the fields sent with every message: description, personality, scenario, system prompt, and post-history instructions." }
repeat_words = { type = "integer", title = "Repeated text from", minimum = 5, default = 20, description = "Words a paragraph needs before a copy of it counts as repeated text." }
placeholders = { type = "array", title = "Placeholders", items = { type = "string" }, default = ["<BOT>", "<USER>", "{char}", "{user}", "[name]", "[character]"], description = "Leftover template text, matched in any case." }

[enrichments]
lint = { type = "score", range = [0, 100], label = "Lint", grid = true, priority = 100, browse = true, section = "score" }
tokens = { type = "score", range = [0, 1000000], label = "Always-on tokens" }
problems = { type = "list", label = "Problems", browse = true, section = "problems" }
language = { type = "text", label = "Language", browse = true, section = "kind" }

[searches.junk]
name = "Junk"
filter = { or = [
  { enrichment = "problems", is = "too_short" },
  { enrichment = "problems", is = "placeholder" },
  { enrichment = "problems", is = "no_first_message" },
  { enrichment = "problems", is = "no_description" },
] }

[searches.non_english]
name = "Non-English"
# missing = false: a not alone would match cards card-lint hasn't checked.
# Unknown is a card too short or mixed to tell, not a foreign one.
filter = { and = [
  { enrichment = "language", missing = false },
  { not = { enrichment = "language", is = "English" } },
  { not = { enrichment = "language", is = "Unknown" } },
] }
