name = "forge-ai"
version = "0.6.0"
protocol = 1
command = ["./forge-ai"]
capabilities = ["action", "records", "enrich", "settings"]
description = "Write, revise, tighten, expand, and evaluate cards, write examples, alternate greetings, and lore entries, and score cards in bulk for the library grid, through an ai instance. Each action's instructions can be overridden on the Prompts tab. Keeps Agent Skills the model can load. Needs a core with the ai, action, records, enrich, and settings capabilities, and an ai instance offering chat."
category = "AI"
uses = ["ai.chat", "ai.decide"]
database = true

[config]
type = "object"
required = ["connection"]

[config.properties.connection]
type = "integer"
title = "AI connection"
format = "instance"
x-offers = "ai.chat"
description = "The ai instance whose chat model every action uses."

[config.properties.decide]
type = "integer"
title = "Decision connection"
format = "instance"
x-offers = "ai.decide"
description = "Optional. Scores cards for the library first, with one ai.decide call each: first impression, voice, roleplayability, and quality. Cards it fails on or isn't sure of go to the AI connection, which also scores consistency and token efficiency."

[config.properties.escalate_below]
type = "number"
title = "Escalate below confidence"
minimum = 0
maximum = 1
default = 0.25
description = "When the decision connection's mean confidence for a card is below this, the AI connection scores it instead. 0 keeps every decision; 1 sends every card on."

[config.properties.temperature]
type = "number"
title = "Temperature"
description = "Leave empty to use each action's own."

[config.properties.max_tokens]
type = "integer"
title = "Max tokens"
description = "Leave empty to use each action's own: 8192 for Forge, alternate greetings, and lore entries, 4096 for the rest."

[config.properties.prompts]
type = "object"
title = "Prompts"
description = "Each action's instructions. Leave one unchanged to follow the plugin's default as it improves; reset brings it back."

[config.properties.prompts.properties]
house_style = { type = "string", title = "House style", contentMediaType = "text/plain", description = "Added to every action's system prompt, such as \"British spelling; no em dashes\"." }
whole-card = { type = "string", title = "Whole card guidance", contentMediaType = "text/plain", description = "How a whole-card edit plans each field before editing it." }
generate-first = { type = "string", title = "Forge, first person", contentMediaType = "text/plain" }
generate-third = { type = "string", title = "Forge, third person", contentMediaType = "text/plain" }
generate-scenario = { type = "string", title = "Forge, scenario card", contentMediaType = "text/plain" }
revise = { type = "string", title = "Revise", contentMediaType = "text/plain" }
tighten = { type = "string", title = "Tighten", contentMediaType = "text/plain" }
expand = { type = "string", title = "Expand", contentMediaType = "text/plain" }
to-prose = { type = "string", title = "Convert to prose", contentMediaType = "text/plain" }
change-pov = { type = "string", title = "Change point of view", contentMediaType = "text/plain" }
examples = { type = "string", title = "Write examples", contentMediaType = "text/plain" }
alternate-greetings = { type = "string", title = "Write alternate greetings", contentMediaType = "text/plain" }
lore-entries = { type = "string", title = "Write lore entries", contentMediaType = "text/plain" }
evaluate = { type = "string", title = "Evaluate", contentMediaType = "text/plain" }

[enrichments]
quality = { type = "score", range = [0, 100], label = "Quality", grid = true }
consistency = { type = "score", range = [0, 100], label = "Consistency" }
voice = { type = "score", range = [0, 100], label = "Voice" }
first_impression = { type = "score", range = [0, 100], label = "First impression" }
roleplayability = { type = "score", range = [0, 100], label = "Roleplayability" }
token_efficiency = { type = "score", range = [0, 100], label = "Token efficiency" }
field_governance = { type = "score", range = [0, 100], label = "Field governance" }

[records.skill]
label = "Skills"
import = ["file", "url"]

[records.skill.schema]
type = "object"
required = ["name", "description", "body"]
properties.name = { type = "string", title = "Name", description = "1 to 64 lowercase letters, digits, and single hyphens." }
properties.description = { type = "string", title = "Description", description = "What the skill does and when to use it. The model reads this to decide whether to load it." }
properties.body = { type = "string", title = "Instructions", contentMediaType = "text/markdown" }
properties.enabled = { type = "boolean", title = "Enabled", description = "Offer this skill to the model. New and imported skills start enabled.", default = true }
properties.files = { type = "object", title = "Reference files", description = "Text files the model can load, by path, such as {\"references/campus.md\": \"…\"}.", additionalProperties = { type = "string" } }
