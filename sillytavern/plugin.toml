name = "sillytavern"
title = "SillyTavern"
version = "0.3.4"
protocol = 1
command = ["./sillytavern"]
capabilities = ["push", "pull"]
multiple_instances = true
description = "For SillyTavern users: keeps your SillyTavern characters and world info in step with your library, both ways. Needs your SillyTavern address, with Innkeeper allowed by its whitelist."
category = "Apps"
icon = "icon.svg"
secrets = ["password"]

[config]
type = "object"
required = ["url"]

[config.properties.url]
type = "string"
title = "Server URL"
description = "The SillyTavern server, such as https://sillytavern.example.com. If Innkeeper runs in Docker, reach one on the same machine at host.docker.internal, such as http://host.docker.internal:8000, not localhost."

[config.properties.auth]
type = "string"
title = "Login"
oneOf = [
  { const = "none", title = "No login" },
  { const = "basic", title = "Browser login prompt (basic auth)" },
  { const = "account", title = "SillyTavern user accounts" },
]
default = "none"
description = "How SillyTavern asks you to log in."

[config.properties.username]
type = "string"
title = "Username"
x-when = { auth = ["basic", "account"] }

[config.x-secrets.password]
title = "Password"
x-when = { auth = ["basic", "account"] }

[config.if]
required = ["auth"]

[config.if.properties.auth]
enum = ["basic", "account"]

[config.then]
required = ["username"]
