name = "sillytavern"
title = "SillyTavern"
version = "0.3.2"
protocol = 1
command = ["./sillytavern"]
capabilities = ["push", "pull"]
multiple_instances = true
description = "Push cards and lorebooks to a SillyTavern server as characters and world info files, and read them back."
category = "Apps"
icon = "icon.svg"
secrets = ["password"]

[config]
type = "object"
required = ["url"]

[config.properties.url]
type = "string"
title = "Server URL"
description = "The SillyTavern server, such as https://sillytavern.example.com"

[config.properties.auth]
type = "string"
title = "Login"
enum = ["none", "basic", "account"]
default = "none"
description = "How SillyTavern asks you to log in. none: no login. basic: a browser login prompt. account: SillyTavern's own user accounts."

[config.properties.username]
type = "string"
title = "Username"
description = "Needed unless Login is none. Enter the password below."

[config.if]
required = ["auth"]

[config.if.properties.auth]
enum = ["basic", "account"]

[config.then]
required = ["username"]
