name = "ai"
title = "AI"
version = "0.2.2"
protocol = 1
command = ["./ai"]
capabilities = ["ai", "settings"]
multiple_instances = true
description = "Connect a language model for other plugins to use: chat and embeddings from OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, Ollama, llama.cpp, or any OpenAI-compatible server, and decisions from a /v1/systemone decision model or a chat model. One instance per connection."
category = "AI"
secrets = ["api_key"]

[settings.actions]
test = { label = "Test connection" }

[config]
type = "object"
required = ["provider", "model"]

[config.properties.provider]
type = "string"
title = "Provider"
enum = ["openai-compatible", "openai", "anthropic", "gemini", "mistral", "groq", "deepseek", "ollama", "llamacpp", "llamafile"]
description = "openai-compatible covers vLLM, llama.cpp servers, LM Studio, and OpenRouter. The API key is optional for it and for ollama, llamacpp, and llamafile."

[config.properties.base_url]
type = "string"
title = "Base URL"
description = "The API's URL, such as http://localhost:1234/v1. Required for openai-compatible; for other providers it overrides the default."

[config.properties.model]
type = "string"
title = "Model"
x-options = true
description = "Load choices lists the provider's models. Anthropic doesn't list them, so type the name."

[config.properties.kinds]
type = "array"
title = "Provides"
description = "What this connection is for. Test connection checks each one. decide needs a server with /v1/systemone under the base URL; chat also answers decisions, more roughly."
default = ["chat"]
items = { type = "string", enum = ["chat", "embed", "decide"] }
