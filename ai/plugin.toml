name = "ai"
title = "AI"
version = "0.2.7"
protocol = 1
command = ["./ai"]
capabilities = ["ai", "settings"]
multiple_instances = true
description = "Connects Innkeeper to an AI model, hosted (OpenAI, Anthropic, Gemini, and others, with an API key) or local (Ollama, LM Studio, llama.cpp). Forge and search by meaning use it; it does nothing on its own."
category = "AI"
secrets = ["api_key"]

[settings.actions]
test = { label = "Test connection" }

[config]
type = "object"
required = ["provider", "model"]

[config.x-secrets.api_key]
title = "API key"
description = "Needed for hosted providers. Local servers usually need none."

[config.properties.provider]
type = "string"
title = "Provider"
oneOf = [
  { const = "openai-compatible", title = "OpenAI-compatible server (LM Studio, vLLM, OpenRouter, and others)" },
  { const = "openai", title = "OpenAI" },
  { const = "anthropic", title = "Anthropic" },
  { const = "gemini", title = "Google Gemini" },
  { const = "mistral", title = "Mistral" },
  { const = "groq", title = "Groq" },
  { const = "deepseek", title = "DeepSeek" },
  { const = "ollama", title = "Ollama" },
  { const = "llamacpp", title = "llama.cpp" },
  { const = "llamafile", title = "llamafile" },
]
description = "Who runs the model. Pick OpenAI-compatible for LM Studio, vLLM, a llama.cpp server, or OpenRouter."

[config.properties.base_url]
type = "string"
title = "Base URL"
description = "The API's URL, such as https://openrouter.ai/api/v1. Required for openai-compatible; for other providers it overrides the default. If Innkeeper runs in Docker, reach a model server on the same machine at host.docker.internal, such as http://host.docker.internal:1234/v1, not localhost."

[config.properties.model]
type = "string"
title = "Model"
x-options = true
x-options-needs = { provider = {}, base_url = { provider = ["openai-compatible"] } }
description = "Load choices lists the provider's models. Anthropic doesn't list them, so type the name."

[config.properties.kinds]
type = "array"
title = "Provides"
description = "What this connection is for. Test connection checks each one. Quick scoring needs a decision model server; a chat model also scores, more slowly and roughly."
default = ["chat"]
items = { type = "string", oneOf = [
  { const = "chat", title = "Writing (chat)" },
  { const = "embed", title = "Search by meaning (embeddings)" },
  { const = "decide", title = "Quick scoring (decision model)" },
] }
