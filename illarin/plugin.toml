name = "illarin"
title = "Illarin"
version = "0.1.2"
protocol = 1
command = ["./illarin"]
capabilities = ["import"]
description = "Add cards and lorebooks from illarin.com: paste a work's link, or import every work you send to Innkeeper there. The first import gives you a code to approve on Illarin."
category = "Import"
inputs = ["url"]
database = true

[config]
type = "object"

[config.properties.base_url]
type = "string"
title = "Illarin address"
description = "Leave empty for https://illarin.com. Changing it disconnects; the next import connects again."
