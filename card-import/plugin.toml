name = "card-import"
title = "Card import"
version = "0.3.2"
protocol = 1
command = ["./card-import"]
capabilities = ["import"]
description = "Bring in card and lorebook files you already have: upload them, or import a whole folder on the server."
category = "Import"
inputs = ["file", "folder"]

[config]
type = "object"

[config.properties.folder]
type = "string"
title = "Folder"
default = "/import"
description = "Absolute path of the folder imports may read, as the core sees it. Compose mounts ./import there. Leave empty to import only uploads."
