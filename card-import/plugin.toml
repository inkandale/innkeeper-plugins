name = "card-import"
title = "Card import"
version = "0.3.1"
protocol = 1
command = ["./card-import"]
capabilities = ["import"]
description = "Import character cards and lorebooks from a folder or an uploaded file."
category = "Import"
inputs = ["file", "folder"]

[config]
type = "object"

[config.properties.folder]
type = "string"
title = "Folder"
default = "/import"
description = "Absolute path of the folder imports may read, as the core sees it. Compose mounts ./import there. Leave empty to import only uploads."
