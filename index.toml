# One [[plugin]] entry per plugin folder. Format: innkeeper core design spec,
# "Plugin repository".

# The setup wizard shows these categories first, in this order.
categories = ["Apps", "Import", "Login"]

[[plugin]]
name = "card-codec"
category = "Formats"
path = "card-codec"
version = "0.2.1"
protocol = 1
capabilities = ["codec"]
description = "Read and write character cards: CCv3, V2, and V1, as PNG and JSON. Also reads CharX."

[[plugin]]
name = "password-login"
category = "Login"
path = "password-login"
version = "0.2.1"
protocol = 1
capabilities = ["auth"]
description = "Log in as the owner with one password."

[[plugin]]
name = "card-import"
category = "Import"
recommended = true
path = "card-import"
version = "0.2.2"
protocol = 1
capabilities = ["import"]
description = "Import character cards and lorebooks from a folder or an uploaded file."

[[plugin]]
name = "lumiverse"
category = "Apps"
recommended = true
path = "lumiverse"
version = "0.3.1"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a Lumiverse server as characters and world books, and read them back."

[[plugin]]
name = "sillytavern"
category = "Apps"
recommended = true
path = "sillytavern"
version = "0.3.1"
protocol = 1
capabilities = ["push", "pull"]
description = "Push cards and lorebooks to a SillyTavern server as characters and world info files, and read them back."

[[plugin]]
name = "chub-archive"
category = "Import"
path = "chub-archive"
version = "0.3.2"
protocol = 1
capabilities = ["import"]
description = "Import the chub.ai archive's SQL dump into a library, one card per item with every version."

[[plugin]]
name = "url-import"
category = "Import"
path = "url-import"
version = "0.3.2"
protocol = 1
capabilities = ["import", "sites", "pull"]
description = "Import a card or lorebook from its page URL on chub.ai, RisuRealm, or Character Tavern, link library items to their pages there, and check those pages for the author's changes. Needs a core with source_kinds."

[[plugin]]
name = "forge-ai"
category = "AI"
path = "forge-ai"
version = "0.7.0"
protocol = 1
capabilities = ["action", "records", "enrich", "settings"]
description = "Write, revise, tighten, expand, and evaluate cards, write examples, alternate greetings, and lore entries, and score cards in bulk for the library grid, through an ai instance. Each action's instructions can be overridden on the Prompts tab. Keeps Agent Skills the model can load. Needs a core with the ai, action, records, enrich, and settings capabilities, and an ai instance offering chat."

[[plugin]]
name = "ai"
category = "AI"
path = "ai"
version = "0.2.1"
protocol = 1
capabilities = ["ai", "settings"]
description = "Connect a language model for other plugins to use: chat and embeddings from OpenAI, Anthropic, Gemini, Mistral, Groq, DeepSeek, Ollama, llama.cpp, or any OpenAI-compatible server, and decisions from a /v1/systemone decision model or a chat model. One instance per connection. Needs a core with the ai and settings capabilities."

[[plugin]]
name = "card-lint"
category = "Quality"
path = "card-lint"
version = "0.3.1"
protocol = 1
capabilities = ["enrich"]
description = "Score cards with fast checks that need no model: missing fields, size, repeated text, leftover placeholders, markup, and garbled text, and detect each card's language. Use it to filter an archive before a model-based evaluation: problems and language show in the library sidebar with counts."
