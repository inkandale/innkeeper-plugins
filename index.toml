# One [[plugin]] entry per plugin folder. Format: innkeeper core design spec,
# "Plugin repository".

# The setup wizard shows these categories first, in this order.
categories = ["Apps", "Import", "AI", "Quality", "Login", "Advanced"]

[[plugin]]
name = "card-codec"
title = "Card codec"
category = "Formats"
path = "card-codec"
version = "0.3.2"
protocol = 1
capabilities = ["codec"]
description = "Reads and writes character card files: PNG and JSON in every common card format, and CharX. Innkeeper needs it to import or export any card."

[[plugin]]
name = "password-login"
title = "Password login"
category = "Login"
path = "password-login"
version = "0.2.3"
protocol = 1
capabilities = ["auth"]
description = "Sign in to Innkeeper with a password. You set it when you claim the server."

[[plugin]]
name = "card-import"
title = "Card import"
category = "Import"
recommended = true
path = "card-import"
version = "0.3.2"
protocol = 1
capabilities = ["import"]
description = "Bring in card and lorebook files you already have: upload them, or import a whole folder on the server."

[[plugin]]
name = "lumiverse"
title = "Lumiverse"
category = "Apps"
recommended = true
path = "lumiverse"
version = "0.3.3"
protocol = 1
capabilities = ["push", "pull"]
description = "For Lumiverse users: keeps your Lumiverse characters and world books in step with your library, both ways. Needs your Lumiverse address and login."

[[plugin]]
name = "sillytavern"
title = "SillyTavern"
category = "Apps"
recommended = true
path = "sillytavern"
version = "0.3.4"
protocol = 1
capabilities = ["push", "pull"]
description = "For SillyTavern users: keeps your SillyTavern characters and world info in step with your library, both ways. Needs your SillyTavern address, with Innkeeper allowed by its whitelist."

[[plugin]]
name = "chub-archive"
title = "Chub archive"
category = "Advanced"
path = "chub-archive"
version = "0.3.4"
protocol = 1
capabilities = ["import"]
description = "For the full chub.ai archive download: loads every card in it, with each version, into a library. Needs the archive extracted and mounted on the server."

[[plugin]]
name = "url-import"
title = "URL import"
category = "Import"
path = "url-import"
version = "0.3.5"
protocol = 1
capabilities = ["import", "sites", "pull"]
description = "Add a card or lorebook by pasting its link from chub.ai, RisuRealm, or Character Tavern, and see when its author updates it."

[[plugin]]
name = "illarin"
title = "Illarin"
category = "Import"
path = "illarin"
version = "0.1.2"
protocol = 1
capabilities = ["import"]
description = "Add cards and lorebooks from illarin.com: paste a work's link, or import every work you send to Innkeeper there. The first import gives you a code to approve on Illarin."

[[plugin]]
name = "forge-ai"
title = "Forge"
category = "AI"
path = "forge-ai"
version = "0.11.7"
protocol = 1
capabilities = ["action", "records", "enrich", "settings"]
uses = ["ai.chat", "ai.decide"]
description = "An AI co-writer: drafts new cards, rewrites and tightens fields, adds greetings, examples, and lore, and rates cards. Needs the AI plugin set up with a chat model."

[[plugin]]
name = "ai"
title = "AI"
category = "AI"
path = "ai"
version = "0.2.6"
protocol = 1
capabilities = ["ai", "settings"]
description = "Connects Innkeeper to an AI model, hosted (OpenAI, Anthropic, Gemini, and others, with an API key) or local (Ollama, LM Studio, llama.cpp). Forge and search by meaning use it; it does nothing on its own."

[[plugin]]
name = "card-lint"
title = "Card lint"
category = "Quality"
path = "card-lint"
version = "0.4.2"
protocol = 1
capabilities = ["enrich"]
description = "Free, instant checks on every card, no AI needed: missing fields, too short or too long, repeated text, leftover placeholders, garbled text, and language. Try it before AI scoring on a big library."

[[plugin]]
name = "crucible"
title = "Crucible"
category = "Advanced"
path = "crucible"
version = "0.2.2"
protocol = 1
capabilities = ["enrich"]
description = "Rates cards with a crucible scoring service you run yourself: quality, rating, card type, content flags, and suggestions. Only useful if you have a crucible server."
