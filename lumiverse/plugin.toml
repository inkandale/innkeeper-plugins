name = "lumiverse"
title = "Lumiverse"
version = "0.3.3"
protocol = 1
command = ["./lumiverse"]
capabilities = ["push", "pull"]
multiple_instances = true
description = "For Lumiverse users: keeps your Lumiverse characters and world books in step with your library, both ways. Needs your Lumiverse address and login."
category = "Apps"
icon = "icon.svg"
secrets = ["password"]

[config]
type = "object"
required = ["url", "username"]

[config.properties.url]
type = "string"
title = "Server URL"
description = "The Lumiverse server, such as https://lumiverse.example.com. If Innkeeper runs in Docker, reach one on the same machine at host.docker.internal, not localhost."

[config.properties.username]
type = "string"
title = "Username or email"
description = "The Lumiverse account the cards go to. An address with @ signs in by email."
