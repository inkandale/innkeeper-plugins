name = "lumiverse"
title = "Lumiverse"
version = "0.3.2"
protocol = 1
command = ["./lumiverse"]
capabilities = ["push", "pull"]
multiple_instances = true
description = "Push cards and lorebooks to a Lumiverse server as characters and world books, and read them back."
category = "Apps"
icon = "icon.svg"
secrets = ["password"]

[config]
type = "object"
required = ["url", "username"]

[config.properties.url]
type = "string"
title = "Server URL"
description = "The Lumiverse server, such as https://lumiverse.example.com"

[config.properties.username]
type = "string"
title = "Username or email"
description = "The Lumiverse account the cards go to. An address with @ signs in by email."
